<div class="ap-page-header__text">
  <!--
    `<h1>` لا `<h2>`: عنوان الصفحة هو عنوانها الأعلى، والنمط القائم يبدأ من
    المستوى الثاني بلا أوّل فوقه — فمن يتصفّح بقائمة العناوين يجد الصفحة
    بلا رأس.
  -->
  <h1 class="ap-page-header__title">{{ headingValue() }}</h1>

  @if (descriptionValue()) {
    <!--
      النصّ ممرَّر والرابط مُسقَط بعده مباشرةً في السطر نفسه: الجملة تنتهي
      بـ «اقرأ المقال» فيُقرأ امتدادًا لها لا عنصرًا منفصلًا تحتها.

      ⚠️ لا مسافة بيضاء بين النصّ و`<ng-content>` — تُترك المسافة في نهاية
         الجملة نفسها. المسافة هنا تظهر ولو كان المنفذ فارغًا.
    -->
    <p class="ap-page-header__description">{{ descriptionValue() }}<ng-content /></p>
  }
</div>

<!--
  ⚠️ صفر مسافة بيضاء داخل غلاف الأفعال — يُخفى بـ `:empty` حين لا يُسقَط فيه
     شيء، ومسافة واحدة تُبطله فيبقى غلاف فارغ يأكل الفجوة. القاعدة نفسها
     الموثّقة في منافذ الأيقونات.
-->
<div class="ap-page-header__actions"><ng-content select="[apPageHeaderActions]" /></div>
