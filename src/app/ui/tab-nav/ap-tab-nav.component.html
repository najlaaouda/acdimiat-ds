<!--
  `<nav>` حقيقي لا `<div role="navigation">`: المعلَم مجّاني مع العنصر
  الأصلي، ولا يحتاج دورًا يُكتب ولا يُنسى.

  والاسم على المعلَم لا على الحاوي `<ap-tab-nav>`: قارئ الشاشة يبحث عن
  المعالم، والوسم المخصّص ليس واحدًا منها.
-->
<nav class="ap-tab-nav__nav" #nav [attr.aria-label]="labelValue()">
  <ng-content />
</nav>
