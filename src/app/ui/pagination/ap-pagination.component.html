<div class="ap-pagination__bar">
  <!--
    جملة المدى — الجزء الذي تسقطه أغلب التنفيذات.

    `role="status"` و`aria-live="polite"`: النقر على «التالي» يغيّر جدولًا في
    مكان آخر من الشاشة ولا يقول شيئًا. وهذه الجملة هي التغذية الراجعة الوحيدة
    التي تصل إلى من لا يرى الجدول — «عرض 31–45 من 150 نتيجة» تقول إن الانتقال
    وقع، وأين وقع.

    و`polite` لا `assertive`: خبرٌ مفيد لا عاجل.

    ⚠️ والمدى داخل `dir="ltr"` — وهو ليس تجميلًا.

       «16–30» في فقرة RTL تنقلب إلى «30–16»: الشرطة محايدة، وخوارزمية
       الاتجاه ثنائي الاتجاه تعامل الأرقام معاملة الحروف القوية RTL في
       القاعدة N1، فتأخذ الشرطة اتجاه ما حولها ويُعاد ترتيب الطرفين. والعطل
       صامت تمامًا: النصّ صحيح في الـ DOM ومقلوب على الشاشة، فيقرأ المستخدم
       مدًى يبدأ حيث ينتهي.
  -->
  <p class="ap-pagination__summary" [id]="summaryId" role="status" aria-live="polite">
    عرض
    <span class="ap-pagination__range" dir="ltr">{{ rangeFrom() }}–{{ rangeTo() }}</span>
    من {{ totalValue() }} {{ countedNoun() }}
  </p>

  <div class="ap-pagination__controls">
    <!--
      معلَم `<nav>` يلفّ الأسهم والأرقام وحدها.

      وجملة المدى وقائمة الحجم خارجه عمدًا: الأولى خبر والثانية تغيّر **ما
      أرى** لا **أين أنا** — وإدخالهما في المعلَم يجعل قارئ الشاشة يعدّهما
      وجهتين.

      ⛔ ولا `<ol>` هنا، بخلاف `<ap-breadcrumbs>`. القائمة تُعلن «عنصر 3 من 7»،
         والسبعة هي عدد **الخلايا** لا عدد الصفحات — 15 صفحة تُعلن سبعًا. وعدد
         الصفحات الحقيقي في جملة المدى وفي اسم كل زرّ.
    -->
    <nav class="ap-pagination__nav" [attr.aria-label]="labelValue()">
      <!--
        ⚠️ `aria-disabled` لا `disabled` على السهمين.

           الفرق يظهر عند الطرف بالضبط: من ينقر «التالي» بلوحة المفاتيح حتى
           الصفحة الأخيرة يجد الزرّ الذي يقف عليه قد صار `disabled` — فيسقط
           التركيز إلى `<body>` ويضيع مكانه من الصفحة كلها. و`aria-disabled`
           يُعلنه معطَّلًا ويُبقيه في ترتيب التنقّل، والحارس في `previous()`
           و`next()` هو ما يجعل النقر بلا أثر.

           وهو ما يتوقّعه `_state.scss` أصلًا: قواعد المرور فيه تستثني
           `[aria-disabled='true']` كما تستثني `:disabled`.
      -->
      <button
        type="button"
        class="ap-pagination__cell ap-pagination__arrow"
        [attr.aria-disabled]="isFirst() ? 'true' : null"
        aria-label="الصفحة السابقة"
        (click)="previous()"
      >
        <!-- مرسومة LTR كما تُرسم كل أيقونة اتجاهية في المكتبة، وتُعكس في RTL. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 6-6 6 6 6" />
        </svg>
      </button>

      @for (cell of cells(); track cell.key) {
        @if (cell.kind === 'page') {
          <!--
            اسم الزرّ «الصفحة 3» لا «3»: رقمٌ مجرَّد لا يقول ما هو حين يُعلن
            وحده. والنصّ المرئي جزء من الاسم، فلا يُخالفه ما يُنطق (WCAG 2.5.3).

            و`aria-current="page"` هي **خطّاف النمط نفسه** — الحالي يُنسَّق من
            السمة لا من كلاس، فالزرّ الذي ينسى إعلان نفسه لا يبدو حاليًا.
            القاعدة نفسها في `[apTabNavLink]`.
          -->
          <button
            type="button"
            class="ap-pagination__cell ap-pagination__page"
            [attr.aria-current]="cell.current ? 'page' : null"
            [attr.aria-label]="'الصفحة ' + cell.page"
            (click)="goTo(cell.page)"
          >
            {{ cell.page }}
          </button>
        } @else {
          <!--
            «…» علامة لا زرّ — وهو عكس قرار `<ap-breadcrumbs>` بالحرف نفسه.

            هناك خلف «…» شيء **معيَّن** لا سبيل إليه غيرها، فهي زرّ يكشفه.
            وهنا الصفحات المطويّة تُبلَغ بالانتقال، فزرٌّ يقفز خمس صفحات وعدٌ
            بلا اسم يقوله. ومخفيّة عن قارئ الشاشة لأن ما تخفيه معلوم من اسم
            كل زرّ ومن جملة المدى.
          -->
          <span class="ap-pagination__ellipsis" aria-hidden="true">…</span>
        }
      }

      <button
        type="button"
        class="ap-pagination__cell ap-pagination__arrow"
        [attr.aria-disabled]="isLast() ? 'true' : null"
        aria-label="الصفحة التالية"
        (click)="next()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 6 6 6-6 6" />
        </svg>
      </button>
    </nav>

    <!--
      قائمة حجم الصفحة — داخل `<ap-field>` لا عارية.

      وهي قاعدة بنيوية لا اصطلاح: أنماط `[apSelect]` تعيش في ورقة `<ap-field>`،
      والحاوي هو ما يولّد الـ id ويربط الـ label. فلا مسار يُنتج قائمة بلا اسم.

      والـ label مخفيّ بصريًا لا محذوف: النصّ داخل الزرّ يقول «15 لكل صفحة»
      ويكفي بصريًا، ولا يقول **ماذا** يُختار — والاسم يقوله لمن يسمع.
    -->
    @if (pageSizesValue().length) {
      <ap-field
        class="ap-pagination__size"
        label="عدد الصفوف في الصفحة"
        [labelHidden]="true"
      >
        <!--
          `<ap-select>` لا `<select apSelect>`: القائمة المرسومة هي المعتمدة
          حيث يهمّ شكل اللائحة، وهذا موضعها — فوق جدول، إلى جوار فلتره
          المرسوم. وقائمتان بمظهرين على شاشة واحدة تُقرآن أداتين مختلفتين.

          ⚠️ و`[fitContent]`: بمقدار أوسع خياراتها («100 لكل صفحة») لا بعرض
             مكتوب لها ولا بعرض الصفّ. وهي تحجز ذلك العرض فلا تنكمش عند
             العودة إلى «10» — والشريط كلّه يقوم على ألّا يزحف شيء تحت
             المؤشّر، وهو ما يفرض ثبات خلايا الأرقام السبع فوقها.

          ⚠️ والقيمة عبر `[ngModel]` لا `[value]`: `<ap-select>` عنصر تحكّم
             نموذج (CVA)، وقيمته الحقيقية هي `value` الخيار — رقمٌ هنا لا
             نصّ. وهذا وحده يُسقط فخّ `<select>`: لا سباق بين ربط القيمة
             وتصيير الخيارات، فالمقارنة تقع في المكوّن على القائمة الجاهزة.
        -->
        <ap-select
          size="sm"
          [fitContent]="true"
          [options]="pageSizeOptions()"
          [ngModel]="pageSizeValue()"
          (ngModelChange)="changePageSize($event)"
        />
      </ap-field>
    }
  </div>
</div>
